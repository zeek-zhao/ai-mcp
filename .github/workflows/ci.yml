name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # gitleaks 对 PR 事件按提交范围扫描（首提交^..head），需要完整历史
          fetch-depth: 0

      - name: 统一配置入库检查
        run: |
          set -e
          # 统一配置改造（T-CFG-01）：仓库只保留模板与 Schema；真实配置 mcp.config.json 含凭证，不得被 Git 跟踪
          test -f mcp.config.sample.json || { echo "::error::缺少统一配置模板 mcp.config.sample.json"; exit 1; }
          test -f mcp.config.schema.json || { echo "::error::缺少统一配置 Schema mcp.config.schema.json"; exit 1; }

          # 用法：git ls-files | has_tracked_suite_config；跟踪清单中出现 mcp.config.json（任意目录）即返回 0
          has_tracked_suite_config() { grep -E '(^|/)mcp\.config\.json$' >/dev/null; }

          if git ls-files | has_tracked_suite_config; then
            echo "::error::检测到真实统一配置 mcp.config.json 被 Git 跟踪（该文件含凭证，已被 .gitignore 排除）。请执行：git rm --cached mcp.config.json"
            exit 1
          fi
          echo "统一配置入库检查通过：mcp.config.json 未被跟踪"

      - name: 旧分服务配置入库检查
        run: |
          set -e
          # 分服务配置模板已下线（T-DOC-02），配置统一为仓库根 mcp.config.json；
          # 历史上各服务目录下的真实配置文件含凭证，仍不得被 Git 跟踪
          if git ls-files | grep -E '(^|/)(gerrit_config\.json|jenkins_config\.json|atlassian_config\.json|\.env)$'; then
            echo "::error::检测到旧的真实本地配置被跟踪，请移出版本库（该文件含凭证，应被 .gitignore 排除）"
            exit 1
          fi
          echo "旧分服务配置入库检查通过：没有真实本地配置被跟踪"

      - name: 注册表 StartCommand 防回归检查
        run: |
          set -e
          # 四服务 StartCommand 必须已回填（不得为 $null 或 <> 占位）
          if grep -q 'StartCommand   = \$null' scripts/mcpctl.config.ps1; then
            echo "::error::注册表存在未回填的 StartCommand（\$null）"
            exit 1
          fi
          n=$(grep -c 'StartCommand   = @(' scripts/mcpctl.config.ps1 || true)
          if [ "$n" -lt 4 ]; then
            echo "::error::StartCommand 已回填条目数不足 4（当前 ${n}）"
            exit 1
          fi
          if grep -q '<待' scripts/mcpctl.config.ps1; then
            echo "::error::注册表仍含 <待…> 占位符"
            exit 1
          fi

      # 新增服务一致性检查（T-FLOW-01）：注册表每条服务都必须同步到工作流（docs/planning/新增MCP服务工作流.md）的各处。
      # 哪一处没同步，就指明服务、配置段、第几步、缺哪个文件的什么内容；模板 / Schema / 网关 / 用例里多出未注册的服务也报错。
      # 只读取文件文本做比对，不依赖 pwsh 与 node。
      - name: 新增服务一致性检查
        run: |
          set -e
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          errors = []


          def fail(message):
              errors.append(message)


          def read(name):
              path = Path(name)
              return path.read_text(encoding="utf-8-sig") if path.is_file() else None


          def load_json(name):
              text = read(name)
              if text is None:
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return None


          REGISTRY = "scripts/mcpctl.config.ps1"
          SAMPLE = "mcp.config.sample.json"
          SCHEMA = "mcp.config.schema.json"
          FIELD_DOC = "docs/services/配置字段说明.md"
          WIZARD = "scripts/lib/config-wizard.ps1"
          GATEWAY_SOURCE = "scripts/lib/gateway-routes.ps1"
          GATEWAY_SAMPLE = "gateway.routes.sample.json"
          CASES = "scripts/tests/cases/services.json"
          SERVICE_DOC = "docs/services/服务接入说明.md"

          # 1) 注册表条目逐条解析（某条缺字段时只影响本条，不会串到下一条）
          registry_text = read(REGISTRY)
          if registry_text is None:
              fail(f"缺少 {REGISTRY}")
              registry_text = ""
          block = re.search(r"\$script:McpServices\s*=\s*@\((.*)\)", registry_text, re.S)
          services = []
          for entry in re.findall(r"@\{(.*?)\n\s{4}\}", block.group(1) if block else "", re.S):
              record = {"id": "", "key": "", "stack": "", "start": []}
              for field, name in (("Id", "id"), ("ConfigKey", "key"), ("Stack", "stack")):
                  matched = re.search(field + r"\s*=\s*'([^']*)'", entry)
                  record[name] = matched.group(1) if matched else ""
              matched = re.search(r"StartCommand\s*=\s*@\(([^)]*)\)", entry)
              record["start"] = re.findall(r"'([^']*)'", matched.group(1)) if matched else []
              services.append(record)
          if not services:
              fail(f"无法从 {REGISTRY} 解析服务条目（$script:McpServices 的写法可能已变）")

          sample = load_json(SAMPLE)
          schema = load_json(SCHEMA)
          cases = load_json(CASES)
          gateway_sample = load_json(GATEWAY_SAMPLE)

          def keys_of(doc, name):
              value = doc.get(name) if isinstance(doc, dict) else None
              return list(value) if isinstance(value, dict) else []

          def items_of(doc, name):
              value = doc.get(name) if isinstance(doc, dict) else None
              return [item for item in value if isinstance(item, dict)] if isinstance(value, list) else []

          def block_of(text, variable):
              matched = re.search(re.escape(variable) + r"\s*=\s*\[ordered\]@\{(.*?)\n\}", text, re.S)
              return matched.group(1) if matched else ""

          def child_of(doc, name):
              value = doc.get(name) if isinstance(doc, dict) else None
              return value if isinstance(value, dict) else {}

          sample_keys = keys_of(sample, "services")
          # Schema 里服务段的两个落点：definitions.services.properties.<配置段>（$ref）与 definitions.<配置段>（字段定义）；其余 definitions 是公共片段
          schema_definitions = keys_of(schema, "definitions")
          schema_properties = keys_of(child_of(child_of(schema, "definitions"), "services"), "properties")
          schema_keys = [key for key in schema_properties if key in schema_definitions]
          case_list = items_of(cases, "services")
          gateway_block = block_of(read(GATEWAY_SOURCE) or "", "$script:McpGatewayNames")
          gateway_names = dict(re.findall(r"'([a-z0-9-]+)'\s*=\s*'([^']+)'", gateway_block))
          gateway_sample_names = list(keys_of(gateway_sample, "mcpServers")) if isinstance(gateway_sample, dict) and isinstance(gateway_sample.get("mcpServers"), dict) else []
          wizard_keys = re.findall(r"^\s{4}([a-z][a-z0-9]*)\s*=\s*@\(", block_of(read(WIZARD) or "", "$script:McpSuiteFieldCatalog"), re.M)
          field_doc_rows = re.findall(r"^\|\s*`services\.([a-z0-9]+)\.([A-Za-z0-9_]+)`\s*\|\s*([^|]*)\|", read(FIELD_DOC) or "", re.M)
          service_doc_ids = re.findall(r"^##\s+\d+\.\s+(mcp-[a-z0-9-]+)", read(SERVICE_DOC) or "", re.M)

          # 2) 每条注册表服务：工作流第 2–9 步的同步项
          for svc in services:
              sid, key = svc["id"], svc["key"]

              def missing(step, what, sid=sid, key=key):
                  fail(f"{sid or '<未知服务>'}（配置段 {key or '<未填>'}）第 {step} 步未完成：{what}")

              if not sid or not key:
                  missing(4, f"{REGISTRY} 的条目缺少 Id / ConfigKey")
                  continue
              start = svc["start"]
              if len(start) < 2 or not all(start):
                  missing(4, f"{REGISTRY} 中 {sid} 的 StartCommand 未回填（应为 [命令, 启动器] 两项）")
                  continue
              launcher = start[1].replace("\\", "/")
              if launcher.split("/")[0] != sid:
                  missing(2, f"StartCommand 的启动器 {launcher} 应位于 {sid}/ 目录下")
              if not Path(launcher).is_file():
                  missing(3, f"缺少启动器 {launcher}")
              manifest = {"python": f"{sid}/requirements.txt", "node": f"{sid}/package.json"}.get(svc["stack"])
              if manifest and not Path(manifest).is_file():
                  missing(2, f"缺少依赖清单 {manifest}")

              if key not in sample_keys:
                  missing(5, f"{SAMPLE} 的 services 中缺少 {key} 配置段")
              if key not in schema_keys:
                  missing(5, f"{SCHEMA} 中缺少 {key}：须在 definitions.services.properties 新增同名键（$ref 指向 definitions.{key}），并在 definitions 新增 {key} 的字段定义")
              if not [field for name, field, _required in field_doc_rows if name == key]:
                  missing(5, f"{FIELD_DOC} 的字段全表中没有 services.{key}.* 的行")
              if key not in wizard_keys:
                  missing(6, f"{WIZARD} 的 $script:McpSuiteFieldCatalog 中缺少 {key} 的字段目录")
              gateway_name = gateway_names.get(sid)
              if not gateway_name:
                  missing(7, f"{GATEWAY_SOURCE} 的 $script:McpGatewayNames 中没有 {sid}")
              elif gateway_name not in gateway_sample_names:
                  missing(7, f"{GATEWAY_SAMPLE} 的 mcpServers 中缺少 {gateway_name}")
              if not Path(f"scripts/tests/test-{key}.bat").is_file():
                  missing(8, f"缺少 scripts/tests/test-{key}.bat")
              case = next((item for item in case_list if item.get("id") == sid), None)
              if case is None:
                  missing(8, f"{CASES} 的 services 中没有 id 为 {sid} 的用例")
              elif case.get("configKey") != key or (gateway_name and case.get("gatewayName") != gateway_name):
                  missing(8, f"{CASES} 中 {sid} 的 configKey / gatewayName 应为 {key} / {gateway_name}（当前：{case.get('configKey')} / {case.get('gatewayName')}）")
              if sid not in service_doc_ids:
                  missing(9, f"{SERVICE_DOC} 中没有「## <序号>. {sid}」小节")

          # 3) 反向：各处多出未注册的服务同样报错
          registry_keys = {svc["key"] for svc in services}
          registry_ids = {svc["id"] for svc in services}
          for key in sample_keys:
              if key not in registry_keys:
                  fail(f"{SAMPLE} 的 services.{key} 没有对应的注册表服务（第 4 步）：请在 {REGISTRY} 登记，或删除该配置段")
          for key in schema_properties:
              if key not in registry_keys:
                  fail(f"{SCHEMA} 的 definitions.services.properties.{key} 没有对应的注册表服务（第 4 步）：请在 {REGISTRY} 登记，或删除该键")
          for key in [key for key in schema_definitions if key in schema_properties or key not in ("services", "baseUrl", "instances")]:
              if key not in registry_keys and key in sample_keys:
                  fail(f"{SCHEMA} 的 definitions.{key} 对应未注册的服务（第 4 步）：请在 {REGISTRY} 登记，或删除该定义")
          for key in sorted({name for name, _field, _required in field_doc_rows} - registry_keys):
              fail(f"{FIELD_DOC} 含未注册服务的字段行：services.{key}.*")
          for key in wizard_keys:
              if key not in registry_keys:
                  fail(f"{WIZARD} 的 $script:McpSuiteFieldCatalog 含未注册服务配置段 {key}")
          for sid in gateway_names:
              if sid not in registry_ids:
                  fail(f"{GATEWAY_SOURCE} 的 $script:McpGatewayNames 含未注册服务 {sid}")
          for name in gateway_sample_names:
              if name not in set(gateway_names.values()):
                  fail(f"{GATEWAY_SAMPLE} 的 mcpServers.{name} 没有对应的注册表服务（第 7 步）")
          for item in case_list:
              if item.get("id") not in registry_ids:
                  fail(f"{CASES} 的用例 {item.get('id')} 没有对应的注册表服务（第 8 步）")
          for sid in service_doc_ids:
              if sid not in registry_ids:
                  fail(f"{SERVICE_DOC} 的小节 {sid} 没有对应的注册表服务（第 9 步）")
          # 脚手架生成了目录却忘了登记注册表：仓库根下带启动器的 mcp-* 目录必须在注册表中
          for sid in sorted(name for name in os.listdir(".") if name.startswith("mcp-") and os.path.isdir(name) and any(f.startswith("launcher.") for f in os.listdir(name))):
              if sid not in registry_ids:
                  fail(f"服务目录 {sid}/ 已有启动器，但 {REGISTRY} 没有登记该服务（第 4 步）：请按新增 MCP 服务工作流补充注册表条目，或删除该目录")

          for message in errors:
              print(f"::error::{message}")
          if errors:
              print(f"新增服务一致性检查失败：共 {len(errors)} 项问题")
              sys.exit(1)
          print(f"新增服务一致性检查通过：{len(services)} 条服务（{' / '.join(svc['id'] for svc in services)}）均已同步到工作流第 2–9 步的各处")
          PY

      - name: 网关路由样例校验
        run: |
          set -e
          # Magpie 网关接入（TASK-PROXY-01，ADR-008）：gateway.routes.sample.json 的四条路由必须与注册表 StartCommand 一致
          # （防止手抄漂移：启动命令变更时样例必须同步），且样例中不得出现任何凭证类字样与本机绝对路径。
          # 只读取文件文本做比对，不依赖 pwsh；服务名固定为 Gerrit / GitHub / Jenkins / Atlassian（不加前缀）。
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          errors = []


          def fail(message):
              errors.append(message)


          # 服务目录 -> 网关服务名：唯一来源是 scripts/lib/gateway-routes.ps1 的 $script:McpGatewayNames
          # （注册表新增服务时只改那里与样例文件，不改本步骤）
          gateway_source = Path("scripts/lib/gateway-routes.ps1")
          gateway_text = gateway_source.read_text(encoding="utf-8-sig") if gateway_source.is_file() else ""
          names_block = re.search(r"\$script:McpGatewayNames\s*=\s*\[ordered\]@\{(.*?)\}", gateway_text, re.S)
          SERVER_NAMES = dict(re.findall(r"'([a-z0-9-]+)'\s*=\s*'([^']+)'", names_block.group(1))) if names_block else {}
          if not SERVER_NAMES:
              fail("无法从 scripts/lib/gateway-routes.ps1 解析 $script:McpGatewayNames（服务目录 -> 网关服务名）")
          # 样例中的仓库根占位符（T-ENV-02）：由 mcpctl 菜单 8 生成 gateway.routes.json 时替换为本机绝对路径
          PLACEHOLDER = "${MCP_SUITE_ROOT}"
          CONFIG_NAME = "mcp.config.json"
          # 凭证类字样（不分大小写）：写成拼接形式，避免本步骤自身的源码被当作命中
          FORBIDDEN = ("token", "pat", "pa" + "ssword", "secret", "api" + "key")

          registry_path = Path("scripts/mcpctl.config.ps1")
          sample_path = Path("gateway.routes.sample.json")

          if not registry_path.is_file():
              fail("缺少 scripts/mcpctl.config.ps1")
          if not sample_path.is_file():
              fail("缺少 gateway.routes.sample.json")

          registry_text = registry_path.read_text(encoding="utf-8-sig") if registry_path.is_file() else ""
          sample_text = sample_path.read_text(encoding="utf-8-sig") if sample_path.is_file() else ""

          # 1) 从注册表文本解析每条服务的 Id 与 StartCommand（仓库相对路径数组），不执行 PowerShell
          start_commands = {}
          for matched in re.finditer(r"Id\s*=\s*'([^']+)'.*?StartCommand\s*=\s*@\(([^)]*)\)", registry_text, re.S):
              service_id, items = matched.group(1), re.findall(r"'([^']*)'", matched.group(2))
              start_commands[service_id] = items
          if len(start_commands) < 4:
              fail(f"注册表解析到的 StartCommand 只有 {len(start_commands)} 条（预期至少 4 条）")
          for service_id, items in start_commands.items():
              if len(items) != 2:
                  fail(f"注册表 {service_id} 的 StartCommand 应为 [命令, 启动器] 两项（当前 {items}）")
              elif service_id not in SERVER_NAMES:
                  fail(f"注册表新增了服务 {service_id}，须在 scripts/lib/gateway-routes.ps1 的 $script:McpGatewayNames 登记服务名，并同步 gateway.routes.sample.json")

          # 2) 样例结构：顶层只有 _comment 与 mcpServers；服务名恰为四条，且与注册表一一对应
          sample = None
          if sample_path.is_file():
              try:
                  sample = json.loads(sample_text)
              except ValueError as exc:
                  fail(f"gateway.routes.sample.json 不是合法 JSON（{exc.__class__.__name__}）")
          servers = {}
          if sample is not None:
              if not isinstance(sample, dict) or "mcpServers" not in sample or [key for key in sample if key not in ("_comment", "mcpServers")]:
                  fail("gateway.routes.sample.json 的顶层只能有 _comment 与 mcpServers 两个键")
              else:
                  comment = sample.get("_comment")
                  if not isinstance(comment, str) or PLACEHOLDER not in comment:
                      fail(f"gateway.routes.sample.json 的 _comment 必须是说明占位符 {PLACEHOLDER} 的字符串")
                  servers = sample.get("mcpServers")
                  if not isinstance(servers, dict):
                      fail("gateway.routes.sample.json 的 mcpServers 必须是对象")
                      servers = {}
          expected_names = sorted(SERVER_NAMES[service_id] for service_id in start_commands if service_id in SERVER_NAMES)
          if servers and sorted(servers) != expected_names:
              fail(f"gateway.routes.sample.json 的服务名 {sorted(servers)} 与注册表对应的服务名 {expected_names} 不一致（服务名固定，不加前缀）")

          def to_sample_path(relative):
              # 仓库相对路径 -> 样例中的写法：${MCP_SUITE_ROOT}\<相对路径>（统一为反斜杠）
              return PLACEHOLDER + "\\" + relative.replace("/", "\\")


          # 3) 逐条比对 command / args / env 与注册表 StartCommand
          if servers:
              for service_id, items in start_commands.items():
                  if service_id not in SERVER_NAMES or len(items) != 2:
                      continue
                  name = SERVER_NAMES[service_id]
                  entry = servers.get(name)
                  if not isinstance(entry, dict):
                      fail(f"gateway.routes.sample.json 缺少服务 {name}")
                      continue
                  command, launcher = items
                  expected_command = to_sample_path(command) if ("/" in command or "\\" in command) else command
                  expected_args = [to_sample_path(launcher)]
                  expected_env = {"MCP_SUITE_CONFIG": to_sample_path(CONFIG_NAME)}
                  if entry.get("command") != expected_command:
                      fail(f"gateway.routes.sample.json 中 {name}.command 应为 {expected_command!r}（与注册表 StartCommand 一致），当前 {entry.get('command')!r}")
                  if entry.get("args") != expected_args:
                      fail(f"gateway.routes.sample.json 中 {name}.args 应为 {expected_args!r}（与注册表 StartCommand 一致，不补 stdio 等参数），当前 {entry.get('args')!r}")
                  if entry.get("env") != expected_env:
                      fail(f"gateway.routes.sample.json 中 {name}.env 应恰为 {expected_env!r}（只允许 MCP_SUITE_CONFIG），当前 {entry.get('env')!r}")
                  extra = sorted(set(entry) - {"command", "args", "env"})
                  if extra:
                      fail(f"gateway.routes.sample.json 中 {name} 含未约定的键 {extra}（只允许 command / args / env）")

          # 4) 样例中不得出现凭证类字样，也不得出现本机绝对路径（样例只保留 ${MCP_SUITE_ROOT} 占位符）
          lowered = sample_text.lower()
          for word in FORBIDDEN:
              if word in lowered:
                  fail(f"gateway.routes.sample.json 出现了不应出现的字样“{word}”（网关配置里不得出现凭证类字样）")
          if re.search(r"(?<![a-z])[a-z]:[\\/]", lowered):
              fail(f"gateway.routes.sample.json 出现了本机绝对路径（应保持 {PLACEHOLDER} 占位符；填入真实路径的版本保存为 gateway.routes.json，已被 .gitignore 排除）")

          for message in errors:
              print(f"::error::{message}")
          if errors:
              print(f"网关路由样例校验失败：共 {len(errors)} 项问题")
              sys.exit(1)
          print(f"网关路由样例校验通过：{len(servers)} 条路由与注册表 StartCommand 一致；未出现凭证类字样与本机绝对路径")
          PY

      - name: 统一配置模板与 Schema 校验
        run: |
          set -e
          # Runner 未预装 jsonschema 时临时安装（--break-system-packages 用于兜底系统 Python 的 PEP 668 限制）
          python3 -c "import jsonschema" 2>/dev/null || python3 -m pip install --quiet jsonschema || python3 -m pip install --quiet --break-system-packages jsonschema
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          import jsonschema

          # 契约来源（新增服务时不改本步骤）：
          #   服务顺序 —— 注册表 scripts/mcpctl.config.ps1 的 ConfigKey 出现顺序；
          #   必填集合 —— docs/services/配置字段说明.md 字段全表里「必填」列为「是」的行。
          registry_file = Path("scripts/mcpctl.config.ps1")
          registry_source_text = registry_file.read_text(encoding="utf-8-sig") if registry_file.is_file() else ""
          SERVICES = re.findall(r"ConfigKey\s*=\s*'([^']+)'", registry_source_text)
          field_doc_file = Path("docs/services/配置字段说明.md")
          field_doc_text = field_doc_file.read_text(encoding="utf-8-sig") if field_doc_file.is_file() else ""
          EXPECTED_REQUIRED = {name: [] for name in SERVICES}
          for name, field in re.findall(r"^\|\s*`services\.([a-z0-9]+)\.([A-Za-z0-9_]+)`\s*\|\s*是\s*\|", field_doc_text, re.M):
              if name in EXPECTED_REQUIRED:
                  EXPECTED_REQUIRED[name].append(field)
          launcher_paths = []
          for group in re.findall(r"StartCommand\s*=\s*@\(([^)]*)\)", registry_source_text):
              items = re.findall(r"'([^']*)'", group)
              if len(items) >= 2:
                  launcher_paths.append(items[1])

          errors = []


          def fail(message):
              errors.append(message)


          def load(name):
              path = Path(name)
              if not path.is_file():
                  fail(f"缺少 {name}")
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8-sig"))
              except (OSError, ValueError) as exc:
                  fail(f"{name} 不是合法 JSON（{exc.__class__.__name__}）")
                  return None


          sample = load("mcp.config.sample.json")
          schema = load("mcp.config.schema.json")
          services = {}
          hints = {}
          field_paths = []
          schema_services = {}

          if sample is not None:
              if not isinstance(sample, dict):
                  fail("mcp.config.sample.json 的顶层必须是 JSON 对象")
                  sample = {}
              if sample.get("configVersion") != 1:
                  fail(f"sample 的 configVersion 必须为 1（当前：{sample.get('configVersion')!r}）")
              services = sample.get("services")
              if not isinstance(services, dict):
                  fail("sample 缺少 services 对象")
                  services = {}
              elif list(services) != SERVICES:
                  fail(f"sample 的 services 必须依次包含 {SERVICES}，顺序以注册表 ConfigKey 为准（当前：{list(services)}；新增服务时先在注册表登记，再补模板配置段）")
              hints = sample.get("_hints")
              if not isinstance(hints, dict):
                  fail("sample 缺少 _hints 对象")
                  hints = {}

          for name in SERVICES:
              if isinstance(services.get(name), dict):
                  field_paths.extend(f"services.{name}.{field}" for field in services[name])

          # 1) Schema 的必填集合与契约一致；sample 的每个配置段与 Schema 定义的字段完全相同（沿 $ref 取实际定义）
          def resolve(node):
              hops = 0
              while isinstance(node, dict) and "$ref" in node:
                  ref = node["$ref"]
                  parts = ref[2:].split("/") if isinstance(ref, str) and ref.startswith("#/") else None
                  target = schema if parts else None
                  for part in parts or []:
                      if not isinstance(target, dict) or part not in target:
                          target = None
                          break
                      target = target[part]
                  if target is None:
                      fail(f"Schema 引用无法解析：{ref}")
                      return {}
                  node = target
                  hops += 1
                  if hops > 20:
                      fail(f"Schema 引用层数过深：{ref}")
                      return {}
              return node if isinstance(node, dict) else {}

          if schema is not None:
              if not isinstance(schema, dict):
                  fail("mcp.config.schema.json 的顶层必须是 JSON 对象")
                  schema = {}
              schema_services = resolve(schema.get("properties", {}).get("services"))
              if not schema_services:
                  fail("Schema 缺少 services 定义")
              else:
                  if sorted(schema_services.get("required", [])) != sorted(SERVICES):
                      fail(f"Schema 要求的服务段 {sorted(schema_services.get('required', []))} 与契约 {sorted(SERVICES)} 不一致")
                  for name in SERVICES:
                      expected = sorted(EXPECTED_REQUIRED[name])
                      service_schema = resolve(schema_services.get("properties", {}).get(name))
                      if not service_schema:
                          fail(f"Schema 缺少 services.{name} 定义")
                          continue
                      required = sorted(service_schema.get("required", []))
                      if required != expected:
                          fail(f"Schema 对 services.{name} 的必填集合 {required} 与契约 {expected} 不一致（契约取自 docs/services/配置字段说明.md 字段全表中「必填」列为「是」的行）")
                      section = services.get(name)
                      if not isinstance(section, dict):
                          continue
                      missing = [field for field in expected if field not in section]
                      if missing:
                          fail(f"sample 的 services.{name} 缺少必填字段 {missing}")
                      schema_fields = sorted(service_schema.get("properties", {}))
                      if sorted(section) != schema_fields:
                          fail(f"sample 的 services.{name} 字段 {sorted(section)} 与 Schema 定义 {schema_fields} 不一致")

          # 2) _hints 覆盖 sample 中的全部字段路径（每个字段一条中文提示）
          for path in field_paths:
              hint = hints.get(path)
              if not isinstance(hint, str) or not hint.strip():
                  fail(f"sample 的 _hints 缺少字段 {path} 的中文提示")
          stale = sorted(set(hints) - set(field_paths))
          if stale:
              fail(f"sample 的 _hints 含未知字段路径 {stale}")

          # 3) 用 Schema 校验 sample
          if schema:
              try:
                  jsonschema.Draft7Validator.check_schema(schema)
              except jsonschema.exceptions.SchemaError as exc:
                  fail(f"mcp.config.schema.json 自身不合法：{exc.message}")
              else:
                  validator = jsonschema.Draft7Validator(schema)
                  for error in sorted(validator.iter_errors(sample or {}), key=lambda item: list(map(str, item.absolute_path))):
                      where = ".".join(map(str, error.absolute_path)) or "<根>"
                      fail(f"sample 未通过 Schema 校验（{where}）：{error.message}".replace("\n", " "))

          # 4) 模板参考值指纹（T-FIX-F）：唯一来源是 scripts/lib/suite-config.ps1 的 $script:McpSuiteTemplateValuePattern。
          #    sample 里每个“非空、非占位符、非枚举”的字符串参考值都必须能被它命中（否则未替换的参考值会被判成已填写），
          #    四个启动器必须使用同一组关键词（PowerShell / Python / JavaScript 字面量由本步骤逐一比对）。
          import re

          core = None
          source_path = Path("scripts/lib/suite-config.ps1")
          if not source_path.is_file():
              fail("缺少 scripts/lib/suite-config.ps1")
          else:
              matched = re.search(r"\$script:McpSuiteTemplateValuePattern\s*=\s*'\(\?i\)\(([^']+)\)'", source_path.read_text(encoding="utf-8-sig"))
              if matched:
                  core = matched.group(1)
              else:
                  fail("scripts/lib/suite-config.ps1 缺少 $script:McpSuiteTemplateValuePattern 定义（应为 '(?i)(关键词|关键词)' 形式）")
          launchers = []
          if core:
              fingerprint = re.compile(core, re.IGNORECASE)
              # 真默认值（不是示例数据）：不要求命中指纹；新增此类字段时必须同步登记到这里
              true_defaults = {"services.github.baseUrl", "services.gerrit.instanceName"}
              checked = 0
              for name in SERVICES:
                  section = services.get(name)
                  if not isinstance(section, dict):
                      continue
                  for field, value in section.items():
                      path = f"services.{name}.{field}"
                      if not isinstance(value, str) or not value.strip() or re.match(r"^\s*<.*>\s*$", value):
                          continue
                      field_schema = resolve(schema_services.get("properties", {}).get(name)) if schema_services else {}
                      enum = resolve(field_schema.get("properties", {}).get(field)).get("enum", []) if field_schema else []
                      if value in enum or path in true_defaults:
                          continue
                      checked += 1
                      if not fingerprint.search(value):
                          fail(f"sample 的 {path} 是模板参考值，却未被模板参考值指纹命中：请把该参考值的关键词加入 McpSuiteTemplateValuePattern（并同步四个启动器），或确认为真默认值后登记到本步骤的白名单")
              if checked < 5:
                  fail(f"sample 中受指纹保护的参考值只有 {checked} 个（预期至少 5 个），指纹校验可能已失效")
              # 注册表每条服务的启动器（StartCommand 第二项）都必须带同一组指纹；按语言核对字面量写法
              launchers = [
                  (launcher, f're.compile(r"{core}", re.IGNORECASE)' if launcher.endswith(".py") else f"/({core})/i")
                  for launcher in launcher_paths
              ]
              for launcher, literal in launchers:
                  launcher_path = Path(launcher)
                  if not launcher_path.is_file():
                      fail(f"缺少 {launcher}")
                  elif literal not in launcher_path.read_text(encoding="utf-8-sig"):
                      fail(f"{launcher} 的模板参考值指纹与 suite-config.ps1 不一致：应包含字面量 {literal}")

          # 第 5 段（T-ENV-01）：仓库根路径环境变量 MCP_SUITE_ROOT 的报错文案，在 registry.ps1 与四个启动器之间逐字一致。
          # 占位符写法不同（PowerShell 用 {0}/{1}，Python 用 {root_env}/{ROOT_CLEAR_COMMAND}，Node 用 ${rootEnv}/${ROOT_CLEAR_COMMAND}），比对前统一归一化。
          def normalize_placeholders(text):
              return re.sub(r"\$\{[^{}]*\}|\{[^{}]*\}", "{}", text)

          def root_message_texts(text):
              return [normalize_placeholders(m.group(0)) for m in re.finditer(r"环境变量 MCP_SUITE_ROOT [^\"'`\n]*", text)]

          registry_text = Path("scripts/lib/registry.ps1").read_text(encoding="utf-8-sig")
          root_messages = []
          for var_name in ("McpRepoRootNotAbsolutePattern", "McpRepoRootNotRepoPattern"):
              match = re.search(r"\$script:" + var_name + r"\s*=\s*'([^']*)'", registry_text)
              if not match:
                  fail(f"scripts/lib/registry.ps1 缺少 $script:{var_name}（环境变量 MCP_SUITE_ROOT 的报错文案）")
              else:
                  root_messages.append(normalize_placeholders(match.group(1)))
          root_clear = re.search(r"\$script:McpRepoRootClearCommand\s*=\s*'([^']*)'", registry_text)
          if not root_clear or root_clear.group(1) != 'setx MCP_SUITE_ROOT ""':
              fail('scripts/lib/registry.ps1 的 $script:McpRepoRootClearCommand 应为 setx MCP_SUITE_ROOT ""（清除环境变量的命令）')
          for message in root_messages:
              if not message.startswith("环境变量 MCP_SUITE_ROOT ") or not message.endswith("。请改为正确的仓库根目录，或清除该变量后重试：{}"):
                  fail(f"环境变量 MCP_SUITE_ROOT 的报错文案应以「环境变量 MCP_SUITE_ROOT 」开头、以固定的修复提示结尾：{message}")
          # 核对范围取自注册表的 StartCommand（新增服务的启动器同样必须逐字一致）
          for launcher, _fingerprint_literal in launchers:
              launcher_path = Path(launcher)
              if not launcher_path.is_file():
                  fail(f"缺少 {launcher}")
                  continue
              launcher_texts = root_message_texts(launcher_path.read_text(encoding="utf-8-sig"))
              for message in root_messages:
                  if message not in launcher_texts:
                      fail(f"{launcher} 的根路径环境变量（MCP_SUITE_ROOT）报错文案与 scripts/lib/registry.ps1 不一致（归一化占位符后应包含：{message}）")

          for message in errors:
              print(f"::error::{message}")
          if errors:
              print(f"统一配置校验失败：共 {len(errors)} 项问题")
              sys.exit(1)
          print(f"统一配置校验通过：{len(field_paths)} 个字段均有中文提示；Schema 必填集合与契约一致；sample 通过 Schema 校验；模板参考值均被指纹覆盖，注册表全部启动器指纹一致；根路径环境变量报错文案一致")
          PY

      - name: 旧配置引用检查
        run: |
          set -e
          # 分服务配置模板已下线（T-DOC-02）：仓库不得再引用旧配置文件名（含旧 sample 模板名），配置统一为仓库根 mcp.config.json
          # 豁免：历史记录（更新记录、问题记录）只追加不改写；.gitignore 保留旧文件名的忽略规则；本步骤自身的检索模式
          hits=$(git -c core.quotepath=off grep -n -E '(gerrit|jenkins|atlassian)_config|\.env\.template' -- . ':!docs/operations/更新记录.md' ':!docs/operations/问题记录.md' ':!.gitignore' ':!.github/workflows/ci.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到对已下线分服务配置文件的引用（配置已统一为仓库根 mcp.config.json）："
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "旧配置引用检查通过：无分服务配置文件引用"

      - name: 禁止跟踪依赖目录与运行时产物
        run: |
          if git ls-files | grep -E '(node_modules/|\.venv/|venv/|logs/|\.pid$|\.log$)'; then
            echo "::error::检测到依赖目录或运行时产物被跟踪"
            exit 1
          fi

      # 自检脚本结构模式（T-TEST-01）：不需要凭证与依赖。用模板当统一配置，四个启动器必须按预期拒绝
      # （模板参考值 / 占位符）并记为 SKIP，整体退出码为 0；用例、注册表、模板、网关样例不一致则退出码为 1。
      - name: 自检脚本结构模式（Node 直跑）
        run: |
          set -e
          node --version
          node scripts/tests/lib/mcp-stdio-test.mjs --structural

      # 升级工作流（T-FLOW-02）：PR 改了用例里的期望工具数、且任一服务的变化超过 ±20% 时，
      # PR 描述必须粘贴 run-tests.bat --diff 的「工具快照差异」摘要（新增 / 删除 / 签名变化），否则不允许合并。
      # PR 描述经环境变量传入，不拼进脚本，避免描述内容被当作命令执行。
      - name: PR 工具数变化校验（变化超过 ±20% 时须附差异摘要）
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -e
          printf '%s' "$PR_BODY" > "$PR_BODY_FILE"
          node scripts/tests/lib/check-pr-tool-diff.mjs --base "$PR_BASE_SHA" --body-file "$PR_BODY_FILE"

      - name: PowerShell 脚本语法解析（若 pwsh 可用）
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            for f in $(find scripts -name '*.ps1'); do
              pwsh -NoProfile -Command "\$tok = \$null; \$errs = \$null; \$null = [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$tok, [ref]\$errs); if (\$errs.Count) { \$errs | ForEach-Object { Write-Host \$_.Message }; exit 1 }"
            done
            # 注册表自检：必填字段齐全、ConfigKey 唯一且与 mcp.config.sample.json 的 services 键一致
            pwsh -NoProfile -Command ". ./scripts/lib/registry.ps1; \$problems = @(Test-McpRegistry); if (\$problems.Count -gt 0) { \$problems | ForEach-Object { Write-Host \"::error::\$_\" }; exit 1 }; Write-Host '注册表自检通过'"
            # 根路径环境变量自检（T-ENV-01）：未设置 → 由脚本位置推断；设为仓库根 → 取自环境变量；设错 → 报错且不回退
            pwsh -NoProfile -Command ". ./scripts/lib/registry.ps1; if (\$env:MCP_SUITE_ROOT -or (Get-McpRepoRoot) -ne (Get-Location).Path -or (Get-McpRepoRootSourceText) -ne '由脚本位置推断' -or (Get-McpRepoRootIssue)) { Write-Host '::error::未设置 MCP_SUITE_ROOT 时，根路径应由脚本位置推断'; exit 1 }"
            pwsh -NoProfile -Command "\$env:MCP_SUITE_ROOT = (Get-Location).Path; . ./scripts/lib/registry.ps1; if ((Get-McpRepoRoot) -ne (Get-Location).Path -or (Get-McpRepoRootSourceText) -ne '来自环境变量 MCP_SUITE_ROOT' -or (Get-McpRepoRootIssue)) { Write-Host '::error::MCP_SUITE_ROOT 设为仓库根时，根路径应取自环境变量'; exit 1 }"
            pwsh -NoProfile -Command "\$env:MCP_SUITE_ROOT = \$env:RUNNER_TEMP; . ./scripts/lib/registry.ps1; \$issue = Get-McpRepoRootIssue; if (-not \$issue -or -not \$issue.Contains('指向的目录不是本仓库根')) { Write-Host '::error::MCP_SUITE_ROOT 设错时应报告无效'; exit 1 }; \$threw = \$false; try { \$null = Get-McpRepoRoot } catch { \$threw = \$true }; if (-not \$threw) { Write-Host '::error::MCP_SUITE_ROOT 设错时 Get-McpRepoRoot 应报错，而不是静默回退'; exit 1 }; Write-Host '根路径环境变量自检通过'"
          else
            echo "::notice::当前 Runner 无 pwsh，跳过 PowerShell 语法解析"
          fi

      # 网关路由生成器自检（T-ENV-02）：用真实生成器按仓库根生成路由，自检通过且与样例（占位符 ${MCP_SUITE_ROOT}）逐条一致，
      # 防止样例手抄与生成器、注册表之间漂移。临时脚本写在 RUNNER_TEMP，不进工作区。
      - name: 网关路由生成器自检（若 pwsh 可用）
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/mcp-gateway-selfcheck.ps1" <<'PS1'
          $ErrorActionPreference = 'Stop'
          . ./scripts/lib/gateway-routes.ps1
          $root = (Get-Location).Path
          $placeholder = '${MCP_SUITE_ROOT}'
          $routes = New-McpGatewayRoutes -Root $root
          $problems = @(Test-McpGatewayRoutes -Routes $routes -Root $root)
          if ($problems.Count -gt 0) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          $sample = [IO.File]::ReadAllText((Join-Path $root 'gateway.routes.sample.json')) | ConvertFrom-Json
          # 样例是 Windows 形态（反斜杠）；Linux Runner 上生成器输出正斜杠：比较前两侧统一成正斜杠，并把仓库根前缀换成占位符
          $rootSlash = $root.Replace('\', '/')
          function ConvertTo-SampleItem([string]$Text) {
              $t = $Text.Replace('\', '/')
              if ($t.StartsWith($rootSlash, [StringComparison]::OrdinalIgnoreCase)) { return $placeholder + $t.Substring($rootSlash.Length) }
              return $t
          }
          $names = @($sample.mcpServers.PSObject.Properties.Name)
          if (@(Compare-Object @($routes['mcpServers'].Keys) $names).Count -gt 0) {
              Write-Host "::error::生成的路由服务名与样例不一致：$($routes['mcpServers'].Keys -join '、') 对比 $($names -join '、')"
              exit 1
          }
          foreach ($name in $routes['mcpServers'].Keys) {
              $entry = $routes['mcpServers'][$name]
              $want = $sample.mcpServers.$name
              $command = ConvertTo-SampleItem $entry['command']
              $argList = @($entry['args'] | ForEach-Object { ConvertTo-SampleItem $_ })
              $configPath = ConvertTo-SampleItem $entry['env']['MCP_SUITE_CONFIG']
              $wantCommand = ([string]$want.command).Replace('\', '/')
              $wantArgs = @(@($want.args) | ForEach-Object { ([string]$_).Replace('\', '/') })
              $wantConfig = ([string]$want.env.MCP_SUITE_CONFIG).Replace('\', '/')
              if ($command -ne $wantCommand -or ($argList -join '|') -ne ($wantArgs -join '|') -or $configPath -ne $wantConfig) {
                  Write-Host "::error::生成的 $name 路由与样例不一致（command / args / env.MCP_SUITE_CONFIG；样例使用占位符 $placeholder）"
                  Write-Host ("   生成：command={0} args={1} env={2}" -f $command, ($argList -join ' '), $configPath)
                  Write-Host ("   样例：command={0} args={1} env={2}" -f $wantCommand, ($wantArgs -join ' '), $wantConfig)
                  exit 1
              }
          }
          Write-Host "网关路由生成器自检通过：$($routes['mcpServers'].Count) 条路由与注册表一致，并与样例逐条一致"
          PS1
            pwsh -NoProfile -File "$RUNNER_TEMP/mcp-gateway-selfcheck.ps1"
          else
            echo "::notice::当前 Runner 无 pwsh，跳过网关路由生成器自检"
          fi

      # 文档台账一致性审计（规则见 docs/00-文档管理规范.md）：台账 ↔ 文内属性表的编号 / 版本 / 状态 / 日期一致；
      # 结论未回填的验收记录不得标为「生效（A）」。与合并前本地自检使用同一脚本。
      - name: 文档台账一致性审计（若 pwsh 可用）
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File ./scripts/lib/ledger-audit.ps1
          else
            echo "::notice::当前 Runner 无 pwsh，跳过文档台账一致性审计"
          fi

      - name: 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 自检脚本结构模式在 Windows Runner 上运行（T-TEST-01 验收项）：scripts\tests\run-tests.bat --structural 须返回 0。
  # 不需要凭证与依赖环境：venv 未安装时用 PATH 上的 python 代替，node 用 PATH 上的；四个启动器应拒绝模板配置。
  structural-tests:
    name: 自检脚本结构模式（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: run-tests.bat --structural
        shell: cmd
        run: scripts\tests\run-tests.bat --structural
